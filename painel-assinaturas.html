/* ============================================================
   AVISOS (toasts)
   ============================================================ */
const caixaToasts = $('#toasts');
const temPopover = typeof caixaToasts.showPopover === 'function';
function toast(msg, { desfazer = null, acao = null, tipo = '' } = {}) {
  const el = document.createElement('div');
  el.className = 'toast ' + tipo;
  el.setAttribute('role', tipo === 'erro' ? 'alert' : 'status');
  el.innerHTML = `${icon(tipo === 'erro' ? 'alert' : 'check-circle')}<span></span>`;
  el.querySelector('span').textContent = msg;
  const fechar = () => { el.remove(); if (temPopover && !caixaToasts.children.length && caixaToasts.matches(':popover-open')) caixaToasts.hidePopover(); };
  if (desfazer) { const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Desfazer'; b.onclick = () => { restaurar(desfazer); fechar(); toast('Desfeito.'); }; el.append(b); }
  if (acao) { const b = document.createElement('button'); b.type = 'button'; b.textContent = acao.txt; b.onclick = () => { fechar(); acao.fn(); }; el.append(b); }
  caixaToasts.append(el);
  if (temPopover) { try { if (caixaToasts.matches(':popover-open')) caixaToasts.hidePopover(); caixaToasts.showPopover(); } catch (e) { /* segue sem popover */ } }
  while (caixaToasts.children.length > 3) caixaToasts.firstElementChild.remove();
  setTimeout(fechar, desfazer || acao ? 6500 : 3500);
}

/* ============================================================
   ARQUIVOS: backup, restauração e planilhas
   ============================================================ */
function baixar(nome, conteudo, tipo) {
  const url = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
  const a = document.createElement('a');
  a.href = url; a.download = nome;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function baixarBackup() {
  S.ultimoBackup = hoje();
  salvar();
  baixar(`backup-assinaturas-g85-${hoje()}.json`, JSON.stringify(S, null, 2), 'application/json');
  render();
  toast('Backup baixado. Guarde o arquivo num lugar seguro (Drive, e-mail).');
}
const celula = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const planilha = linhas => '﻿' + linhas.map(l => l.map(celula).join(';')).join('\r\n');
const numBR = v => (Number(v) || 0).toFixed(2).replace('.', ',');
function csvAssinantes() {
  indexar();
  const linhas = [['Nome', 'WhatsApp', 'Carro', 'Placa', 'Plano', 'Mensalidade', 'Dia do vencimento', 'Início', 'Situação', 'Forma de pagamento', 'Cancelado em', 'Motivo', 'Observações']];
  for (const a of S.assinantes) linhas.push([a.nome, foneBR(a.telefone), a.veiculo, a.placa, plano(a.planoId).nome, numBR(a.valor), a.dia, dataBR(a.inicio), situacao(a).txt, a.pagamento, dataBR(a.canceladoEm), a.motivo || '', a.obs]);
  baixar(`assinantes-g85-${hoje()}.csv`, planilha(linhas), 'text/csv;charset=utf-8');
}
function csvMes() {
  indexar();
  const rot = { pago: 'Paga', aberto: 'A vencer', atrasado: 'Atrasada' };
  const linhas = [['Assinante', 'Plano', 'Vencimento', 'Valor', 'Situação', 'Pago em', 'Forma', 'Valor recebido']];
  for (const x of cobrancasMes(ui.mes).sort((p, q) => p.venc.localeCompare(q.venc))) linhas.push([x.a.nome, plano(x.a.planoId).nome, dataBR(x.venc), numBR(x.valor), rot[x.st], x.pag ? dataBR(x.pag.data) : '', x.pag ? x.pag.forma : '', x.pag ? numBR(x.pag.valor) : '']);
  baixar(`mensalidades-${ui.mes}.csv`, planilha(linhas), 'text/csv;charset=utf-8');
}
$('#arqBackup').addEventListener('change', e => {
  const arq = e.target.files[0];
  e.target.value = '';
  if (!arq) return;
  const leitor = new FileReader();
  leitor.onload = () => {
    let d;
    try { d = JSON.parse(leitor.result); } catch (err) { d = null; }
    if (!d || !Array.isArray(d.assinantes) || !Array.isArray(d.planos)) { toast('Este arquivo não é um backup do painel de assinaturas.', { tipo: 'erro' }); return; }
    confirmar('Restaurar backup', `O backup tem <b>${plural(d.assinantes.length, 'assinante', 'assinantes')}</b> e <b>${plural(d.planos.length, 'plano', 'planos')}</b>. Os dados atuais deste navegador serão substituídos.`, 'Substituir dados', () => {
      const antes = JSON.stringify(S);
      S = migrar(d); salvar(); render();
      toast('Backup restaurado.', { desfazer: antes });
    });
  };
  leitor.readAsText(arq);
});

/* ============================================================
   AÇÕES (cliques)
   ============================================================ */
function copiar(texto) {
  const ok = () => toast('Texto copiado.');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(texto).then(ok, () => copiarAntigo(texto) && ok());
  else if (copiarAntigo(texto)) ok();
}
function copiarAntigo(texto) {
  const t = document.createElement('textarea');
  t.value = texto; t.style.position = 'fixed'; t.style.opacity = '0';
  (modal.open ? modal : document.body).append(t);
  t.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  t.remove();
  if (!ok) toast('Não deu para copiar automaticamente. Selecione o texto e copie.', { tipo: 'erro' });
  return ok;
}
function trocarTema(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem(CHAVE_TEMA, t); } catch (e) { /* tema só nesta sessão */ }
  render();
}

const ACOES = {
  fecharModal: () => fecharModal(),
  fecharDetalhe: () => drawer.close(),
  abrir: d => abrirDetalhe(d.id),
  novoAssinante: () => abrirFormAssinante(),
  editarAssinante: d => abrirFormAssinante(d.id),
  registrarUso: d => abrirUso(d.id),
  usoEscolher: d => { ui.uso.id = d.id; ui.uso.data = null; ui.uso.obs = ''; usoPasso2(); },
  usoTrocar: () => { ui.uso.id = null; usoPasso1(); },
  usoVoltar: () => usoPasso2(),
  usoRegistrar: (d, el) => {
    const a = assinante(ui.uso.id);
    const data = $('#usoData').value || hoje();
    const b = usosDoMes(a, compDe(data))[+d.b];
    if (!b) return;
    if (!b.restam && !el.classList.contains('armado')) {
      el.classList.add('armado');
      el.querySelector('small').textContent = 'Limite atingido. Clique de novo para registrar como uso extra.';
      return;
    }
    const obs = $('#usoObs').value.trim();
    const antes = mudar(() => S.usos.push({ id: uid(), assinanteId: a.id, beneficio: b.nome, data: data > hoje() ? hoje() : data, obs, criadoEm: Date.now() }));
    fecharModal();
    const resta = Math.max(0, b.restam - 1);
    toast(`${b.nome} registrada para ${primeiroNome(a.nome)}. ${b.restam ? (resta ? `${resta === 1 ? 'Resta' : 'Restam'} ${resta} em ${mesNome(compDe(data))}.` : 'Cota do mês completa.') : 'Uso extra, além da cota.'}`, { desfazer: antes });
  },
  usoRapido: d => {
    const a = assinante(d.id);
    const b = usosDoMes(a, compAtual())[+d.b];
    if (!b) return;
    if (!b.restam) { ui.uso = { id: a.id, veioDaBusca: false }; usoPasso2(); return; }
    const antes = mudar(() => S.usos.push({ id: uid(), assinanteId: a.id, beneficio: b.nome, data: hoje(), obs: '', criadoEm: Date.now() }));
    toast(`${b.nome} registrada hoje para ${primeiroNome(a.nome)}.`, { desfazer: antes });
  },
  apagarUso: d => {
    const antes = mudar(() => { S.usos = S.usos.filter(u => u.id !== d.uso); });
    toast('Registro de uso apagado.', { desfazer: antes });
  },
  receber: d => abrirReceber(d.id, d.comp),
  desfazerPag: d => {
    const a = assinante(d.id);
    const antes = mudar(() => { S.pagamentos = S.pagamentos.filter(p => !(p.assinanteId === d.id && p.comp === d.comp)); });
    toast(`Recebimento de ${mesNome(d.comp)} de ${primeiroNome(a.nome)} desfeito.`, { desfazer: antes });
  },
  mensagem: d => abrirMensagem(d.id, d.tipo, d.comp),
  copiarMsg: () => copiar($('#msgTexto').value),
  abrirWhats: d => {
    const txt = encodeURIComponent($('#msgTexto').value);
    window.open(`https://wa.me/${d.fone || ''}?text=${txt}`, '_blank', 'noopener');
  },
  pausar: d => abrirPausar(d.id),
  cancelar: d => abrirCancelar(d.id),
  reativar: d => reativar(d.id),
  excluirAssinante: d => {
    const a = assinante(d.id);
    confirmar('Excluir assinante', `Excluir <b>${esc(a.nome)}</b> apaga também todas as mensalidades e usos registrados. Para manter o histórico, prefira <b>Cancelar assinatura</b>.`, 'Excluir de vez', () => {
      const antes = mudar(() => {
        S.assinantes = S.assinantes.filter(x => x.id !== a.id);
        S.pagamentos = S.pagamentos.filter(p => p.assinanteId !== a.id);
        S.usos = S.usos.filter(u => u.assinanteId !== a.id);
      });
      if (drawer.open) drawer.close();
      toast(`${a.nome} excluído.`, { desfazer: antes });
    });
  },
  verTodasCob: d => { ui.verTodasCob = ui.verTodasCob === d.id ? null : d.id; desenharDetalhe(); },
  verTodosUsos: d => { ui.verTodosUsos = ui.verTodosUsos === d.id ? null : d.id; desenharDetalhe(); },
  filtroSit: d => { ui.f.st = d.k; render(); },
  limparFiltros: () => { ui.f = { q: '', st: 'todos', plano: '' }; render(); },
  verAtrasadas: () => { ui.mes = compAtual(); ui.mesTab = 'atrasado'; },
  mes: d => { ui.mes = somaMeses(ui.mes, +d.n); render(); },
  mesAtual: () => { ui.mes = compAtual(); render(); },
  mesTab: d => { ui.mesTab = d.k; render(); },
  csvMes: () => csvMes(),
  csvAssinantes: () => csvAssinantes(),
  tabelaReceita: () => { ui.tabelaReceita = !ui.tabelaReceita; render(); },
  editarPlano: d => abrirFormPlano(d.id),
  novoPlano: () => abrirFormPlano(),
  excluirPlano: d => {
    const p = S.planos.find(x => x.id === d.id);
    const n = S.assinantes.filter(a => a.planoId === p.id).length;
    if (n) { toast(`Há ${plural(n, 'assinante', 'assinantes')} neste plano. Desmarque "Disponível para novas assinaturas" para tirá-lo de venda.`, { tipo: 'erro' }); return; }
    confirmar('Excluir plano', `Excluir o plano <b>${esc(p.nome)}</b>?`, 'Excluir plano', () => {
      const antes = mudar(() => { S.planos = S.planos.filter(x => x.id !== p.id); S.planosEditados = true; });
      toast(`Plano ${p.nome} excluído.`, { desfazer: antes });
    });
  },
  benAdd: () => { lerBenRows(); ui.benEdit.push({ id: uid(), tipo: 'qtd', qtd: 1, nome: '' }); desenharBenRows(); const r = $$('#benRows .ben-row').pop(); if (r) $('[data-k="nome"]', r).focus(); },
  benRemover: d => { lerBenRows(); ui.benEdit.splice(+d.i, 1); desenharBenRows(); },
  tabelaWhats: () => tabelaWhats(),
  baixarBackup: () => baixarBackup(),
  restaurarBackup: () => $('#arqBackup').click(),
  tema: () => trocarTema(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'),
  msgsPadrao: () => { const antes = mudar(() => { S.config.msgs = { ...MSGS_PADRAO }; }); toast('Textos das mensagens restaurados.', { desfazer: antes }); },
  carregarExemplo: () => { mudar(() => gerarExemplo()); toast('Exemplos carregados. Explore à vontade.'); },
  apagarExemplo: () => confirmar('Apagar exemplos', 'Os assinantes de exemplo, com suas mensalidades e usos, serão apagados. Planos e assinantes reais continuam.', 'Apagar exemplos', () => {
    const antes = mudar(() => apagarExemplo());
    if (drawer.open) drawer.close();
    toast('Exemplos apagados. O painel está pronto para os seus assinantes.', { desfazer: antes });
  }),
  apagarTudo: () => confirmar('Apagar todos os dados', 'Todos os assinantes, mensalidades, usos e planos deste navegador serão apagados e os planos voltam para a sugestão inicial. <b>Baixe um backup antes</b> se quiser guardar alguma coisa.', 'Apagar tudo', () => {
    const antes = mudar(() => { S = estadoInicial(); });
    if (drawer.open) drawer.close();
    toast('Todos os dados foram apagados.', { desfazer: antes });
  })
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const acao = ACOES[el.dataset.act];
  if (!acao) return;
  if (el.tagName === 'A' && el.dataset.act !== 'verAtrasadas') e.preventDefault();
  acao(el.dataset, el, e);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.tr[data-act]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', e => {
  if (e.target.matches('[data-act-change="temaEscolha"]')) trocarTema(e.target.value);
  if (e.target.id === 'fPlano') { ui.f.plano = e.target.value; desenharListaAss(); }
});
let tSalvo;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'busca') { ui.f.q = t.value; desenharListaAss(); return; }
  if (t.dataset.cfg || t.dataset.msg) {
    if (t.dataset.cfg === 'tolerancia') S.config.tolerancia = Math.max(0, Math.min(30, parseInt(t.value, 10) || 0));
    else if (t.dataset.cfg) S.config[t.dataset.cfg] = t.value;
    else S.config.msgs[t.dataset.msg] = t.value;
    salvar();
    if (t.dataset.cfg === 'tolerancia' || t.dataset.cfg === 'estudio') { indexar(); desenharMenu(); }
    const s = $('#salvo');
    if (s) { s.classList.add('on'); clearTimeout(tSalvo); tSalvo = setTimeout(() => s.classList.remove('on'), 1400); }
  }
});
let tResize;
window.addEventListener('resize', () => { clearTimeout(tResize); tResize = setTimeout(() => { if (ui.view === 'visao') desenharReceita(); }, 120); });
/* virou o dia com o painel aberto: recalcula atrasos */
let diaAberto = hoje();
setInterval(() => { if (hoje() !== diaAberto) { diaAberto = hoje(); if (!modal.open) render(); } }, 60000);

/* ============================================================
   INÍCIO
   ============================================================ */
if (!S) {
  S = estadoInicial();
  indexar();
  gerarExemplo();
  salvar();
}
/* o logo fica uma vez só no arquivo (no ícone da aba) */
const logo = $('link[rel="icon"]').href;
$$('img[data-logo]').forEach(i => { i.src = logo; });
lerRota();
render();
</script>
